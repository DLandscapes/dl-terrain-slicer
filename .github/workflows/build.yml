name: Build downloads

# Tagging a version builds the packaged downloads and attaches them to a
# GitHub Release. Run it by hand first (Actions -> Build downloads -> Run
# workflow) to check a change before committing to a tag. A hand run with a
# release tag rebuilds that release from its tag and adds only the downloads
# it is missing (v1.0.8 lost its macOS arm64 file to a retired runner).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build macOS (tags always do)"
        type: boolean
        default: false
      tag:
        description: "Existing release to complete, e.g. v1.0.8 (empty = a test build)"
        type: string
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 3.12 rather than the newest: every pinned wheel in requirements.txt is
  # available for it on all three runners
  PYTHON_VERSION: "3.12"
  APP_NAME: DL-Terrain-Slicer
  # the release this run builds: the pushed tag or the one named by hand
  VERSION: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'dev' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Citation version matches the tag
        # each release is deposited on Zenodo from its tag; a CITATION.cff
        # that still names the previous version would be archived with it,
        # permanently
        if: ${{ env.VERSION != 'dev' }}
        shell: pwsh
        run: |
          $line = Select-String -Path CITATION.cff -Pattern '^version:\s*"?([^"\s]+)"?' | Select-Object -First 1
          $cff = $line.Matches[0].Groups[1].Value
          $tag = $env:VERSION -replace '^v', ''
          if ($cff -ne $tag) { Write-Error "CITATION.cff says version $cff, the tag is $env:VERSION"; exit 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Run tests
        run: pytest tests -q
      - name: Build
        run: pyinstaller --noconfirm --clean terrainslicer.spec
      - name: Self-test the packaged app
        run: dist/${{ env.APP_NAME }}/${{ env.APP_NAME }}.exe --selftest
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:APP_NAME" -DestinationPath "$env:APP_NAME-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: "*.zip"
          if-no-files-found: error

  macos:
    # Every release gets macOS builds. Manual runs do not unless asked for, to
    # keep a quick check of a Windows-only change quick. (Cost is no longer the
    # reason: the repository is public, and GitHub's standard runners - macOS
    # included - are free for public repositories.)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos || inputs.tag }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 was RETIRED by GitHub in Nov 2026 ("configuration
          # 'macos-14-arm64-us-default' is not supported", v1.0.8)
          - runner: macos-15
            label: macos-arm64
          # macos-13 was RETIRED by GitHub in Dec 2025 - jobs targeting it
          # queue forever (run #4 sat 5.5 h without a runner). macos-15-intel
          # is the last x86_64 image Actions will ever offer; it goes away
          # Aug 2027, and with it the Intel download.
          - runner: macos-15-intel
            label: macos-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Run tests
        run: pytest tests -q
      - name: Build
        run: pyinstaller --noconfirm --clean terrainslicer.spec
      - name: Self-test the packaged app
        run: dist/$APP_NAME/$APP_NAME --selftest
      - name: Package
        # ditto, not zip: it preserves the executable bits and symlinks that
        # a macOS build needs to still run after unpacking
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/$APP_NAME" \
            "$APP_NAME-$VERSION-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: "*.zip"
          if-no-files-found: error

  release:
    # only for tags, and only if the Windows build passed; a skipped macOS
    # job must not block the release
    if: ${{ (github.ref_type == 'tag' || inputs.tag) && !cancelled() && needs.windows.result == 'success' }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Add the downloads the release is missing
        # files already published are never replaced
        if: ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=$(gh release view "$VERSION" --json assets -q '.assets[].name')
          for f in artifacts/*.zip; do
            grep -qxF "$(basename "$f")" <<< "$have" || gh release upload "$VERSION" "$f"
          done
      - name: Create the release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Download the **`DL-Terrain-Slicer-…`** file for your system below,
          unpack it and run it. No Python needed.

          ⚠️ Not "Source code (zip)" / "(tar.gz)" — GitHub adds those to every
          release automatically. They are the source, and need Python plus a
          setup step.

          | Your computer | File |
          |---|---|
          | Windows | `…windows-x64.zip` |
          | Mac with M1/M2/M3/M4 | `…macos-arm64.zip` |
          | Mac with Intel | `…macos-x64.zip` |

          Keep the `_internal` folder next to the program.

          The downloads are **unsigned**: on Windows use SmartScreen's
          *More info → Run anyway*, on macOS right-click → *Open*. See the
          README for details.

          Verify dimensions before cutting. GPLv3, no warranty.
          EOF
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
            --title "DL Terrain Slicer $GITHUB_REF_NAME" \
            --notes-file notes.md
